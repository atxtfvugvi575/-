<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velox Apps</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080b10;
  color:white;
}

header{
  padding:25px 20px;
  text-align:center;
  background:linear-gradient(135deg,#111827,#05070a);
  border-bottom:1px solid #202938;
}

header h1{
  font-size:32px;
  color:#4ade80;
}

header p{
  margin-top:8px;
  color:#9ca3af;
}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 15px;
}

.search{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #293241;
  background:#11151d;
  color:white;
  font-size:16px;
  margin-bottom:25px;
}

.card{
  background:#11151d;
  border:1px solid #252d3a;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
}

.card h2{
  margin-bottom:10px;
  color:#fff;
}

.card p{
  color:#9ca3af;
  line-height:1.7;
  margin-bottom:15px;
}

.info{
  color:#4ade80;
  margin-bottom:15px;
}

.btn{
  display:inline-block;
  padding:12px 20px;
  background:#22c55e;
  color:#06100a;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
}

.btn:hover{
  background:#16a34a;
}

footer{
  text-align:center;
  padding:30px;
  color:#6b7280;
  border-top:1px solid #202938;
  margin-top:30px;
}
</style>
</head>

<body>

<header>
  <h1>VELOX</h1>
  <p>منصة التطبيقات والتحديثات</p>
</header>

<div class="container">

  <input
    class="search"
    type="text"
    placeholder="🔎 ابحث عن تطبيق..."
  >

  <div class="card">
    <h2>📱 اسم التطبيق</h2>
    <p>
      هنا اكتب وصف التطبيق والمميزات والتحديثات الخاصة بيه.
    </p>

    <div class="info">
      الإصدار: 1.0.0
    </div>

    <a class="btn" href="#">
      تحميل التطبيق
    </a>
  </div>

  <div class="card">
    <h2>🚀 تطبيق جديد</h2>
    <p>
      أضف هنا معلومات التطبيق الجديد وروابط التحميل.
    </p>

    <div class="info">
      الإصدار: 2.0
    </div>

    <a class="btn" href="#">
      تحميل التطبيق
    </a>
  </div>

</div>

<footer>
  © 2026 VELOX — جميع الحقوق محفوظة
</footer>

</body>
</html>
